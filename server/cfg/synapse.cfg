// SynapseCS — Configuração do plugin de stats
// Coloque este arquivo em: csgo/cfg/synapse.cfg
// O servidor carrega automaticamente ao iniciar o plugin.

// URL base das Firebase Functions (sem barra final)
// Exemplo: https://us-central1-SEU_PROJETO.cloudfunctions.net
synapse_api_url "https://us-central1-SEU_PROJETO_FIREBASE.cloudfunctions.net"

// Token secreto — deve ser igual ao SYNAPSE_SERVER_SECRET no Firebase Functions config
synapse_api_secret "TROQUE_POR_UM_TOKEN_SECRETO"

// UUID do mix que está sendo jogado (atualize antes de cada mix)
// Use o ID gerado pelo SynapseCS quando criou o mix
synapse_mix_id "00000000-0000-0000-0000-000000000000"

// 1 = ativo, 0 = desativado
synapse_enabled "1"
